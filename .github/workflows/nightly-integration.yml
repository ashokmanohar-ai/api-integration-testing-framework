name: Nightly Integration

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,messaging,postgres]"
      - run: docker compose up -d --build
      - run: python scripts/wait_for_services.py
      - name: Full parallel regression
        run: >-
          pytest -m "not docker" -n auto
          --junitxml=reports/nightly.xml
          --html=reports/nightly.html --self-contained-html
      - name: External Docker checks
        env:
          RUN_DOCKER_TESTS: "1"
        run: pytest -m docker --junitxml=reports/docker.xml
      - run: quality-gate --junit reports/nightly.xml --threshold 100
      - if: failure()
        run: docker compose logs --no-color > reports/nightly-docker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-integration-evidence
          path: reports/
      - if: always()
        run: docker compose down -v
