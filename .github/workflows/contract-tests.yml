name: Contract Tests

on:
  pull_request:
    paths:
      - "framework/clients/**"
      - "demo_system/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Consumer and provider verification
        run: pytest -m contract --junitxml=reports/contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-evidence
          path: |
            reports/contracts.xml
            contracts/pacts/

