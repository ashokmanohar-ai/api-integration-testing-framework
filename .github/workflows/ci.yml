name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,messaging,postgres]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy .
      - name: Generate ephemeral database credential
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start integration environment
        run: docker compose up -d --build
      - name: Wait for healthy services
        run: python scripts/wait_for_services.py
      - name: Docker integration checks
        env:
          RUN_DOCKER_TESTS: "1"
        run: pytest -m docker
      - name: Smoke and contract gates
        run: pytest -m "smoke or contract or critical"
      - name: Full isolated suite and reports
        run: >-
          pytest -m "not docker" -n auto
          --junitxml=reports/junit.xml
          --html=reports/report.html --self-contained-html
      - name: Release quality gate
        run: quality-gate --junit reports/junit.xml --threshold 100
      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color > reports/docker-compose.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-test-evidence
          path: reports/
          if-no-files-found: error
      - name: Stop environment
        if: always()
        run: docker compose down -v
