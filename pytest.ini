[pytest]
addopts = -ra --strict-markers --strict-config
testpaths = tests
markers =
    smoke: fast confidence checks for deployment viability
    regression: broad business regression coverage
    api: REST API behaviour
    graphql: GraphQL query and mutation behaviour
    integration: multi-component business workflow
    contract: consumer/provider contract behaviour
    database: API-to-database consistency
    messaging: event and asynchronous behaviour
    negative: invalid input and error-contract behaviour
    resilience: dependency failure and recovery behaviour
    security: functional API security checks
    critical: release-blocking business behaviour
    docker: requires the Docker Compose environment

